name: Verify learn-skit
on: [push, pull_request]
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python tests/test_tts_completeness.py
      - run: |
          if compgen -G 'study-content/modules/*.json' > /dev/null; then
            python study-content/scripts/validate.py
          fi
