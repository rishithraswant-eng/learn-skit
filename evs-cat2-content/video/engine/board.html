<!doctype html>
<html><head><meta charset="utf-8"><title>EVS chalkboard engine</title>
<style>
@font-face{font-family:Kalam;src:url(fonts/Kalam-Regular.ttf);font-weight:400}
@font-face{font-family:Kalam;src:url(fonts/Kalam-Bold.ttf);font-weight:700}
@font-face{font-family:Caveat;src:url(fonts/Caveat.ttf)}
@font-face{font-family:NotoMath;src:url(fonts/NotoSansMath.ttf)}
@font-face{font-family:PatrickHand;src:url(fonts/PatrickHand-Regular.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
/* Deterministic chalkboard renderer. renderFrame(t) is a pure function of time.
   Board units: one panel = 1920×1080. Output 1280×720 (S = 2/3). */
'use strict';
const W = 1920, H = 1080, M = 90;
let OUT_W = 1280, OUT_H = 720, S = OUT_W / W;
const C = { white: '#F2F0E8', yellow: '#F7DE7E', orange: '#F5A766', sky: '#93D5F2', pink: '#F5A9C8', green: '#AEE3A6', dim: '#BFC6BE' };
const TILE = ['#E57373', '#F0B357', '#7FC47F', '#E05A6A', '#E58F5F', '#5CC3E8', '#F2D35B', '#B5547A', '#EE8B4A', '#D9618C', '#F2A541', '#C9A245', '#5E9E64', '#4F95D1', '#76C26A', '#3F7FBF', '#4C6EA8'];
const FAM = "Kalam, Caveat, NotoMath";
const STY = {
  heading: { size: 86, weight: 700, lh: 1.08 }, sub: { size: 66, weight: 700, lh: 1.15 },
  body: { size: 56, weight: 400, lh: 1.24 }, small: { size: 46, weight: 400, lh: 1.24 },
  big: { size: 128, weight: 700, lh: 1.0 }, label: { size: 50, weight: 700, lh: 1.1 },
  table: { size: 44, weight: 400, lh: 1.2, fam: "PatrickHand, Caveat, NotoMath" }
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const meas = document.createElement('canvas').getContext('2d');

/* ---------- seeded RNG ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

/* ---------- textures ---------- */
let BOARD, GRAIN;
function makeTextures() {
  BOARD = document.createElement('canvas'); BOARD.width = Math.ceil(W * S); BOARD.height = OUT_H;
  const b = BOARD.getContext('2d'), r = rng(7);
  const g = b.createLinearGradient(0, 0, 0, OUT_H); g.addColorStop(0, '#22362D'); g.addColorStop(.55, '#1E3029'); g.addColorStop(1, '#1A2A24');
  b.fillStyle = g; b.fillRect(0, 0, BOARD.width, OUT_H);
  for (let i = 0; i < 26; i++) {               // smudges, wrapped horizontally => seamless tiling
    const x = r() * BOARD.width, y = r() * OUT_H, rad = 90 + r() * 260, a = .018 + r() * .03;
    for (const dx of [-BOARD.width, 0, BOARD.width]) {
      const rg = b.createRadialGradient(x + dx, y, 0, x + dx, y, rad); rg.addColorStop(0, `rgba(230,235,225,${a})`); rg.addColorStop(1, 'rgba(230,235,225,0)');
      b.fillStyle = rg; b.fillRect(x + dx - rad, y - rad, rad * 2, rad * 2);
    }
  }
  for (let i = 0; i < 22000; i++) { b.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},${.02 + r() * .05})`; b.fillRect(r() * BOARD.width, r() * OUT_H, 1, 1); }
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
  const gr = GRAIN.getContext('2d'), r2 = rng(11);
  for (let i = 0; i < 9000; i++) { gr.fillStyle = `rgba(0,0,0,${.25 + r2() * .75})`; gr.fillRect(r2() * 256, r2() * 256, r2() < .8 ? 1 : 2, 1); }
}
function chalkify(c2, seed) {             // eat grain holes out of a pre-rendered item
  const g = c2.getContext('2d'); g.save(); g.globalCompositeOperation = 'destination-out';
  const r = rng(seed); g.translate(-r() * 256, -r() * 256);
  g.fillStyle = g.createPattern(GRAIN, 'repeat'); g.fillRect(0, 0, c2.width + 512, c2.height + 512); g.restore();
}

/* ---------- text helpers ---------- */
const fontOf = st => `${st.weight || 400} ${st.size}px ${st.fam || FAM}`;
function wrap(text, st, maxW) {
  meas.font = fontOf(st); const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (meas.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out.map(l => ({ text: l, w: meas.measureText(l).width }));
}

/* ---------- items ---------- */
// item: {kind:'text'|'stroke'|'live', x,y,w,h, t0,t1, img, lines|polys, panel, color}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * S) + 8); c.height = Math.max(1, Math.ceil(h * S) + 8); return c; }
function textItem(text, x, y, maxW, style, color, extra = {}) {
  const st = STY[style] || STY.body, lines = wrap(text, st, maxW), lh = st.size * st.lh;
  const w = Math.max(1, ...lines.map(l => l.w)), h = lines.length * lh + st.size * .25;
  const it = { kind: 'text', x, y, w, h, lines, lh, st, color: C[color] || color || C.white, ...extra };
  const c = mkCanvas(w + 10, h + 10), g = c.getContext('2d');
  g.scale(S, S); g.translate(4, 4); g.font = fontOf(st); g.textBaseline = 'alphabetic';
  const r = rng(hash(text + x + y));
  lines.forEach((l, i) => {
    const by = i * lh + st.size * .95;
    g.globalAlpha = .55; g.fillStyle = it.color; g.fillText(l.text, (r() - .5) * 1.6, by + (r() - .5) * 1.6);
    g.globalAlpha = .9; g.fillText(l.text, 0, by);
  });
  chalkify(c, hash(text)); it.img = c; return it;
}
function strokeItem(polys, color, width = 6, extra = {}) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  polys.forEach(p => p.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
  const pad = width + 6, it = { kind: 'stroke', x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad, polys, color: C[color] || color || C.white, width, ...extra };
  it.len = polys.reduce((s, p) => s + plen(p), 0);
  const c = mkCanvas(it.w, it.h), g = c.getContext('2d'); g.scale(S, S); g.translate(4 - it.x, 4 - it.y);
  g.lineCap = g.lineJoin = 'round'; g.strokeStyle = it.color; const r = rng(hash(JSON.stringify(polys[0] || []) + it.color));
  for (let pass = 0; pass < 2; pass++) {
    g.globalAlpha = pass ? .9 : .45; g.lineWidth = width * (pass ? 1 : 1.5);
    polys.forEach(p => { g.beginPath(); p.forEach(([x, y], i) => { const jx = (r() - .5) * (pass ? 1.2 : 2.4), jy = (r() - .5) * (pass ? 1.2 : 2.4); i ? g.lineTo(x + jx, y + jy) : g.moveTo(x + jx, y + jy); }); g.stroke(); });
  }
  chalkify(c, hash(it.x + ':' + it.y)); it.img = c; return it;
}
const plen = p => p.reduce((s, q, i) => i ? s + Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]) : 0, 0);
const line = (x0, y0, x1, y1, n = 12) => Array.from({ length: n + 1 }, (_, i) => [x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]);
const ellipse = (cx, cy, rx, ry, a0 = -2.4, sweep = 6.6, n = 64) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + sweep * i / n; return [cx + rx * Math.cos(a) * (1 + .03 * Math.sin(3 * a)), cy + ry * Math.sin(a)]; });
const rrect = (x, y, w, h, r = 22) => { const p = []; const c = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + i * Math.PI / 12; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  c(x + w - r, y + r, -Math.PI / 2); c(x + w - r, y + h - r, 0); c(x + r, y + h - r, Math.PI / 2); c(x + r, y + r, Math.PI); p.push(p[0]); return p; };
function arrowPolys(x0, y0, x1, y1, head = 26) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  return [line(x0, y0, x1, y1, 16), [[x1 - head * Math.cos(a - .45), y1 - head * Math.sin(a - .45)], [x1, y1], [x1 - head * Math.cos(a + .45), y1 - head * Math.sin(a + .45)]]];
}


/* ---------- original line-art icons (spec §8.4 "sketch"); each returns polylines in a 100×100 box ---------- */
const ell = (cx, cy, rx, ry, rot = 0, n = 36) => Array.from({ length: n + 1 }, (_, i) => { const a = i * 2 * Math.PI / n, x = rx * Math.cos(a), y = ry * Math.sin(a); return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });
const ICONS = {
  leaf: () => [ell(50, 50, 40, 20, -0.7), line(22, 78, 80, 20, 8)],
  flask: () => [[[40, 10], [40, 40], [16, 88], [84, 88], [60, 40], [60, 10]], line(34, 10, 66, 10, 4), line(26, 70, 74, 70, 6)],
  atom: () => [ell(50, 50, 44, 15, 0), ell(50, 50, 44, 15, 1.05), ell(50, 50, 44, 15, -1.05), ell(50, 50, 4, 4, 0, 10)],
  rock: () => [[[6, 88], [30, 40], [44, 60], [62, 18], [94, 88], [6, 88]], [[52, 42], [62, 18], [72, 40]]],
  globe: () => [ell(50, 50, 42, 42), ell(50, 50, 18, 42), line(8, 50, 92, 50, 8), line(14, 30, 86, 30, 8), line(14, 70, 86, 70, 8)],
  coin: () => [ell(50, 50, 42, 42), ell(50, 50, 32, 32), [[36, 30], [64, 30]], [[36, 42], [64, 42]], [[40, 30], [52, 30], [56, 36], [52, 42], [40, 42], [60, 70]]],
  pillar: () => [[[10, 34], [50, 10], [90, 34], [10, 34]], line(22, 38, 22, 80, 4), line(42, 38, 42, 80, 4), line(58, 38, 58, 80, 4), line(78, 38, 78, 80, 4), line(8, 86, 92, 86, 6)],
  people: () => [ell(34, 30, 12, 12), ell(68, 34, 11, 11), [[12, 88], [16, 58], [34, 48], [52, 58], [56, 88]], [[50, 88], [54, 62], [68, 54], [84, 62], [88, 88]]],
  gear: () => { const p = []; for (let i = 0; i <= 48; i++) { const a = i * 2 * Math.PI / 48, r = (Math.floor(i / 3) % 2) ? 32 : 42; p.push([50 + r * Math.cos(a), 50 + r * Math.sin(a)]); } return [p, ell(50, 50, 12, 12)]; },
  scales: () => [line(50, 12, 50, 88, 6), line(18, 26, 82, 26, 6), line(30, 88, 70, 88, 4), [[18, 26], [8, 56]], [[18, 26], [28, 56]], ell(18, 60, 13, 5), [[82, 26], [72, 56]], [[82, 26], [92, 56]], ell(82, 60, 13, 5)],
  factory: () => [[[8, 90], [8, 50], [30, 36], [30, 50], [52, 36], [52, 50], [74, 36], [74, 20], [86, 20], [86, 90], [8, 90]], ell(82, 10, 6, 4), ell(90, 4, 5, 3)],
  tree: () => [ell(50, 36, 30, 28), line(50, 64, 50, 92, 4), line(36, 92, 64, 92, 4)],
  cloud: () => [[[20, 66], [12, 54], [22, 42], [36, 42], [44, 28], [62, 28], [72, 40], [86, 44], [90, 58], [80, 68], [20, 66]]],
  drop: () => [[[50, 8], [72, 46], [76, 62], [68, 80], [50, 88], [32, 80], [24, 62], [28, 46], [50, 8]]],
  sun: () => { const r = [ell(50, 50, 18, 18)]; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; r.push(line(50 + 26 * Math.cos(a), 50 + 26 * Math.sin(a), 50 + 40 * Math.cos(a), 50 + 40 * Math.sin(a), 2)); } return r; },
  bin: () => [[[22, 28], [78, 28]], [[40, 28], [42, 18], [58, 18], [60, 28]], [[28, 28], [32, 88], [68, 88], [72, 28]], line(42, 40, 43, 78, 4), line(58, 40, 57, 78, 4)],
  phone: () => [[[32, 8], [68, 8], [72, 14], [72, 86], [68, 92], [32, 92], [28, 86], [28, 14], [32, 8]], line(44, 82, 56, 82, 2)],
  smoke: () => [[[20, 90], [24, 70], [16, 56], [26, 40], [20, 24]], [[48, 90], [52, 70], [44, 56], [54, 40], [48, 24]], [[76, 90], [80, 70], [72, 56], [82, 40], [76, 24]]],
  car: () => [[[6, 70], [12, 52], [30, 48], [40, 32], [66, 32], [78, 48], [94, 54], [94, 70], [6, 70]], ell(28, 72, 9, 9), ell(74, 72, 9, 9)],
  thermo: () => [[[44, 66], [44, 14], [50, 8], [56, 14], [56, 66]], ell(50, 76, 12, 12), line(50, 30, 50, 70, 4)],
  cross: () => [[[38, 10], [62, 10], [62, 38], [90, 38], [90, 62], [62, 62], [62, 90], [38, 90], [38, 62], [10, 62], [10, 38], [38, 38], [38, 10]]]
};
function iconItem(name, x, y, size, color) {
  const f = ICONS[name]; if (!f) { WARN.push('unknown icon ' + name); return null; }
  const polys = f().map(p => p.map(([u, v]) => [x + u * size / 100, y + v * size / 100]));
  return strokeItem(polys, color, 5);
}

/* ---------- scene graph built from the timeline ---------- */
let TL = null, ITEMS = [], ANCH = {}, PANELS = [], BEATS = [], WARN = [], PULSES = [];
function panelState(i) {
  if (!PANELS[i]) PANELS[i] = { x0: i * W, cur: [220, 220], layout: 'flow' };
  return PANELS[i];
}
function cols(P) { const two = /two_col/.test(P.layout), cw = two ? (W - 2 * M - 70) / 2 : W - 2 * M; return { two, cw, x: [P.x0 + M, P.x0 + M + cw + 70] }; }
function place(P, col, h) {
  const k = cols(P), c = k.two ? (col || 0) : 0, y = P.cur[c];
  P.cur[c] += h + 26; if (!k.two) P.cur[1] = P.cur[0];
  if (y + h > H - 70) WARN.push(`overflow panel ${P.idx} at y=${Math.round(y + h)}`);
  return { x: k.x[c], y, w: k.cw };
}
function claimFull(P, h) { const y = Math.max(P.cur[0], P.cur[1]); P.cur = [y + h + 30, y + h + 30]; if (y + h > H - 70) WARN.push(`overflow panel ${P.idx} (full) at y=${Math.round(y + h)}`); return { x: P.x0 + M, y, w: W - 2 * M }; }
function anchor(name) { return ANCH[name]; }
function seqTimes(parts, t0, t1) {           // spread sub-items over [t0,t1] by weight
  const tot = parts.reduce((s, p) => s + p.wt, 0) || 1; let t = t0;
  parts.forEach(p => { const d = (t1 - t0) * p.wt / tot; p.it.t0 = t; p.it.t1 = t + d; t += d; });
}
const wtText = s => Math.max(.4, String(s).length / 14), wtLen = l => Math.max(.3, l / 1800);

const PRIMS = {
  wheel(P, a, p) {
    const n = p.spokes.length, h = p.height || 600, box = claimFull(P, h), cx = box.x + box.w / 2, cy = box.y + h / 2, rx = box.w * .36, ry = h * .40, parts = [], name = a.name || 'wheel';
    parts.push({ it: strokeItem([ell(cx, cy, 170, 62)], 'white', 6), wt: .6 });
    const C0 = textItem(p.center, cx - 160, cy - 30, 320, 'table', p.centerColor || 'green'); C0.x = cx - C0.w / 2; C0.y = cy - C0.h / 2; parts.push({ it: C0, wt: wtText(p.center) });
    p.spokes.forEach((s, i) => {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / n, ex = Math.cos(ang), ey = Math.sin(ang);
      parts.push({ it: strokeItem([line(cx + 175 * ex, cy + 66 * ey, cx + rx * .58 * ex, cy + ry * .66 * ey, 6)], 'dim', 4), wt: .2 });
      const T = textItem(s, 0, 0, 380, 'table', p.colors?.[i] || 'sky'); T.x = cx + rx * ex - T.w / 2; T.y = cy + ry * ey - T.h / 2;
      parts.push({ it: T, wt: wtText(s) }); ANCH[`${name}.${i}`] = T;
    });
    return parts;
  },
  icon_grid(P, a, p) {
    const n = p.items.length, cn = p.cols || 5, rn = Math.ceil(n / cn), ch = p.cellH || 250, box = claimFull(P, rn * ch), cw = box.w / cn, sz = p.size || 110, parts = [], name = a.name || 'icons';
    p.items.forEach(([ic, lab, sub], i) => {
      const x = box.x + (i % cn) * cw, y = box.y + Math.floor(i / cn) * ch, col = p.colors?.[i] || 'white';
      const I = iconItem(ic, x + (cw - sz) / 2, y, sz, col); if (I) parts.push({ it: I, wt: .5 });
      const L = textItem(lab, x + 8, y + sz + 12, cw - 16, 'table', p.labelColor || 'sky'); L.x = x + (cw - L.w) / 2; parts.push({ it: L, wt: wtText(lab) });
      if (sub) { const U = textItem(sub, x + 8, y + sz + 64, cw - 16, 'table', 'dim'); U.x = x + (cw - U.w) / 2; parts.push({ it: U, wt: wtText(sub) * .6 }); }
      ANCH[`${name}.${i}`] = { x, y, w: cw, h: ch - 20 };
    });
    return parts;
  },
  timeline_rail(P, a, p) {
    const ticks = p.ticks, box = claimFull(P, 330), y = box.y + 130, n = ticks.length, gap = box.w / n, parts = [], name = a.name || 'rail';
    const rail = strokeItem([line(box.x, y, box.x + box.w, y, 40)], 'white', 6); parts.push({ it: rail, wt: 1 });
    ticks.forEach(([lab, sub], i) => {
      const cx = box.x + gap * (i + .5);
      parts.push({ it: strokeItem([line(cx, y - 22, cx, y + 22, 4)], 'white', 6), wt: .2 });
      const L = textItem(lab, cx - gap / 2 + 20, box.y, gap - 40, 'label', 'yellow'); L.x = cx - L.w / 2; parts.push({ it: L, wt: wtText(lab) });
      if (sub) { const T = textItem(sub, cx - gap / 2 + 20, y + 34, gap - 40, 'small', 'white'); T.x = cx - T.w / 2; parts.push({ it: T, wt: wtText(sub) }); }
      ANCH[`${name}.${i}`] = { x: L.x, y: L.y, w: L.w, h: y + 22 - L.y };
      ANCH[`${name}.${i}.detail`] = { x: cx - gap / 2 + 16, y: y + 100, w: gap - 32, h: 120, center: cx };
    });
    return parts;
  },
  compare_2col(P, a, p) {
    const box = claimFull(P, p.height || 520), cw = (box.w - 80) / 2, parts = [], name = a.name || 'cmp';
    parts.push({ it: strokeItem([line(box.x + cw + 40, box.y, box.x + cw + 40, box.y + (p.height || 520), 20)], 'dim', 5), wt: .6 });
    [['L', p.left, box.x], ['R', p.right, box.x + cw + 80]].forEach(([k, side, x]) => {
      const T = textItem(side.title, x, box.y, cw, 'sub', side.color || 'sky'); parts.push({ it: T, wt: wtText(side.title) });
      ANCH[`${name}.${k}`] = { x, y: box.y, w: cw, h: T.h };
      let y = box.y + T.h + 20;
      (side.items || []).forEach((s, i) => { const I = textItem('• ' + s, x, y, cw, 'small', side.itemColor || 'white'); parts.push({ it: I, wt: wtText(s) }); ANCH[`${name}.${k}.${i}`] = I; y += I.h + 8; });
    });
    return parts;
  },
  ladder(P, a, p) {
    const steps = p.steps, rowH = p.rowH || 78, k = place(P, a.col, steps.length * rowH), parts = [], name = a.name || 'ladder';
    steps.forEach((s, i) => {
      const y = k.y + i * rowH;
      const N = textItem(String(i + 1), k.x, y, 60, 'label', 'orange'); parts.push({ it: N, wt: .3 });
      const T = textItem(s, k.x + 70, y + 2, k.w - 70, 'small', p.color || 'white'); parts.push({ it: T, wt: wtText(s) });
      if (i < steps.length - 1) parts.push({ it: strokeItem([line(k.x + 18, y + rowH - 16, k.x + 18, y + rowH - 2, 3)], 'dim', 3), wt: .1 });
      ANCH[`${name}.${i}`] = { x: k.x, y, w: T.w + 70, h: rowH - 10 };
    });
    return parts;
  },
  table(P, a, p) {
    const st = STY.table, colsN = p.head.length, rowH = st.size * 1.55, h = rowH * (p.rows.length + 1), k = p.full ? claimFull(P, h) : place(P, a.col, h), parts = [], name = a.name || 'table';
    const cw = p.widths ? p.widths.map(f => f * k.w) : Array(colsN).fill(k.w / colsN);
    const xs = cw.reduce((acc, w) => (acc.push(acc[acc.length - 1] + w), acc), [k.x]);
    parts.push({ it: strokeItem([line(k.x, k.y + rowH, k.x + k.w, k.y + rowH, 30)], 'white', 4), wt: .5 });
    [p.head, ...p.rows].forEach((row, r) => row.forEach((cell, c) => {
      const T = textItem(cell, xs[c] + 10, k.y + r * rowH + 6, cw[c] - 20, 'table', r ? (p.colColors?.[c] || 'white') : 'sky'); parts.push({ it: T, wt: wtText(cell) * .7 });
      ANCH[`${name}.${r}.${c}`] = T;
    }));
    for (let c = 1; c < colsN; c++) parts.push({ it: strokeItem([line(xs[c], k.y, xs[c], k.y + h, 20)], 'dim', 3), wt: .2 });
