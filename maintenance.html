<script>
document.addEventListener('DOMContentLoaded', function(){
  var btn=document.getElementById('theme-toggle');
  if(!btn)return;
  var root=document.documentElement;
  function sync(){btn.setAttribute('aria-checked',root.classList.contains('light')?'false':'true')}
  sync();
  btn.addEventListener('click',function(){
    try{
      var isLight=root.classList.contains('light'),next=isLight?'dark':'light';
      localStorage.setItem('learn-skit-theme',next);
      root.className=next;
      root.setAttribute('data-theme',next);
      root.style.colorScheme=next;
      var m=document.getElementById('meta-theme');
      if(m)m.setAttribute('content',next==='light'?'#F6F5FD':'#1C1D20');
      sync();
    }catch(e){}
  });
});
</script>
